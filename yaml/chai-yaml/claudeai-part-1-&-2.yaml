# Part 1: The Fundamentals (What YAML Actually Is)

# YAML stands for "YAML Ain't Markup Language" (yes, recursive acronym—programmers being clever). It's a human-readable data serialization format. Think of it as JSON's more readable cousin that developers actually enjoy writing.

# Key principle: YAML is all about indentation and structure. No brackets, minimal syntax noise.

#* Basic Syntax Rules

# Comments start with hash
# Indentation MUST be spaces (never tabs!)
# Usually 2 spaces per level

# Key-value pairs (like JSON objects)
name: John Doe
age: 30
isActive: true

# Strings (quotes optional unless special characters)
message: Hello World
quotedMessage: 'Hello: World' # Quotes needed because of colon
multiline: |
  This is a multiline string
  It preserves line breaks
  Perfect for scripts

# Single line multiline (removes line breaks)
description: >
  This long text
  will become a single line
  with spaces between words

#* Data Types
# Strings
user_name: Alice
city: 'New York'

# Numbers
port: 3000
temperature: -15.5

# Boolean (multiple ways to write them)
isProduction: true
isDev: false
isStaging: yes # Also valid
isTest: no # Also valid

# Null values
database: null
cache: ~ # Tilde also means null

# Arrays/Lists (two syntaxes)
# Method 1: Dash notation
fruits:
  - apple
  - banana
  - orange

# Method 2: Inline (like JSON)
color: [red, green, blue]

# Object/Maps
user:
  name: John
  email: john@example.com
  age: 25

# Inline object
address: { street: '123 Main St', city: 'NYC' }

# Part 2: Intermediate Concepts (Where It Gets Useful)
#* Nested Structures

# This is what you will write ALL the time
server:
  host: localhost
  port: 3000
  database:
    connection:
      host: mongodb://localhost:27017
      name: my_app
      options:
        useNewUrlParse: true
        useUnifiedTopology: true
    credentials:
      user: admin
      password: secret123

# Mixed arrays and objects
users:
  - name: Alice
    role: admin
    permissions:
      - read
      - write
      - delete
  - name: Bob
    role: user
    permissions:
      - read

#* Anchors & Aliases (DRY Principle)
# This is YAML's killer feature—reuse blocks of config:

# Define once with &anchor
default-server: &default
  host: localhost
  port: 3000
  timeout: 30

# Reuse with *alias
development:
  server:
    <<: *default # Merge operator
    database: dev_db

production:
  server:
    <<: *default
    port: 8000 # Override specific value
    database: prod_db

# Another example with arrays
common-env: &common-env
  - NODE_ENV
  - PORT
  - DATABASE_URL

frontend-env:
  - *common-env # Won't work as expected
  - REACT_APP_API_URL

# Better approach for arrays
backend-service:
  env: &backend-env
    - NODE_ENV=production
    - PORT=3000

worker-service:
  env:
    - *backend-env
    - WORKER_THREADS=4
