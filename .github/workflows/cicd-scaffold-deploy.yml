name: cicd-scaffold-deploy

on:
  push:
    branches: [main]
    paths:
      - 'cicd-pipeline/lab-cicd-scaffold/**'
  workflow_dispatch: # manual re-run button (ignores the paths filter)

# Cancel an in-flight run if a newer push lands on the same ref.
# Harmless now; prevents stacked builds/deploys once B4 auto-deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo, write packages (GHCR). No PAT in B2.
permissions:
  contents: read
  packages: write

env:
  # Hardcoded — NOT ${{ github.repository }}, which resolves to
  # mahmud035/practices and would misname the image.
  IMAGE_NAME: ghcr.io/mahmud035/lab-cicd-scaffold

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: ./cicd-pipeline/lab-cicd-scaffold
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # single clean manifest; avoids the "unknown/unknown" entry in GHCR
          # platforms: defaults to linux/amd64 (box + runner are amd64). No multi-arch — Addendum D.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          echo "Calling Coolify deploy webhook..."
          response=$(curl --silent --show-error --write-out "\nHTTP_STATUS:%{http_code}" \
            --request GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          echo "Coolify response ($status): $body"
          # Fail loud: non-2xx, OR a 2xx body that actually reports an error
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy failed with HTTP $status"
            exit 1
          fi
          if echo "$body" | grep -qiE 'not allowed|unauthorized|"error"'; then
            echo "::error::Coolify rejected the deploy: $body"
            exit 1
          fi
          echo "Deploy triggered successfully."

      - name: Notify Discord
        if: success()
        run: |
          VERSION=$(grep -oP "process.env.APP_VERSION \|\| '\K[^']+" cicd-pipeline/lab-cicd-scaffold/server.js)
          curl --silent --show-error \
            --request POST "${{ secrets.DISCORD_WEBHOOK }}" \
            --header "Content-Type: application/json" \
            --data "{\"content\": \"🚀 **lab-cicd-scaffold ${VERSION}** deployed to https://lab-scaffold.halalaura.co.uk (\`${GITHUB_SHA::7}\`)\"}"
